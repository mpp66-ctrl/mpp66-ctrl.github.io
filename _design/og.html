<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Social card</title>
<style>
  html, body { margin: 0; padding: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: Georgia, "Times New Roman", Times, serif;
    color: #fff;
    background:
      radial-gradient(900px 500px at 85% 15%, rgba(94, 208, 165, .28), transparent 60%),
      linear-gradient(135deg, #0f1722 0%, #12302f 55%, #0b6e4f 130%);
    display: flex; flex-direction: column; justify-content: center;
    padding: 0 92px; box-sizing: border-box; position: relative;
  }
  .eyebrow { font: 700 24px/1 "Segoe UI", Arial, sans-serif; letter-spacing: .16em; text-transform: uppercase; color: #5ed0a5; margin-bottom: 26px; }
  h1 { font-size: 112px; line-height: 1; margin: 0 0 24px; font-weight: 700; }
  .lead { font: 400 36px/1.3 "Segoe UI", Arial, sans-serif; max-width: 880px; color: #e3e8ef; margin: 0; }
  .url { position: absolute; left: 92px; bottom: 56px; font: 600 26px/1 "Segoe UI", Arial, sans-serif; color: #5ed0a5; }
  .badge { position: absolute; right: 92px; bottom: 44px; width: 96px; height: 96px; border-radius: 22px;
    background: linear-gradient(145deg, #0b6e4f, #3d5a80); display: grid; place-items: center;
    font: 700 46px/1 Georgia, serif; color: #fff; box-shadow: 0 8px 30px rgba(0,0,0,.35); }
</style>
</head>
<body>
  <div class="eyebrow">MS Applied Business Analytics · Boston University</div>
  <h1>Manan Patel</h1>
  <p class="lead">Business analytics student turning complex data into clear recommendations.</p>
  <div class="url">mpp66-ctrl.github.io</div>
  <div class="badge">MP</div>
</body>
</html>
